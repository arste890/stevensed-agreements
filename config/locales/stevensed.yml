    spreadsheet_invalid: The file could not be read. Upload a CSV or XLSX file.
    bulk_empty: The list has no rows to send.
    bulk_too_many: Send at most 2,000 rows at a time.
    sign_in_lede: Use your StevensED account. Staff and families sign in the same way.
    use_password_instead: Use an email and password instead
    signing_request_note: Received a signing request? Open the link in the email. You do not need to sign in to sign a document.
    invite_subject: 'StevensED: please review and sign "%{name}"'
    redirecting_to_sso: Taking you to StevensED sign-in. If nothing happens, choose the button below.
    dashboard: Dashboard
    email:
      # Subjects
      view_subject: 'StevensED: "%{name}" has been shared with you'
      submit_subject: 'StevensED: please complete "%{name}"'
      completed_subject: 'StevensED: "{submission.name}" has been completed'
      declined_subject: 'StevensED: "%{name}" was declined by %{submitter}'
      copy_subject: 'StevensED: your copy of "%{name}"'
      otp_subject: 'StevensED Agreements: your verification code'
      user_invite_subject: 'Your %{product_name} account invitation'
      smtp_subject: '%{product_name}: email delivery confirmed'
      # Shared
      user_invite_intro: You have been invited to join %{product_name}, the electronic agreements service of the StevensED %{office}.
      copy_intro: Thank you. All parties have completed the agreement described below.
      declined_intro: A recipient has declined to sign the agreement described below and has provided a reason.
      completed_intro: All parties have completed the agreement described below.
      view_intro: The %{office} has shared the document described below with you for your review.
      invitation_intro_submit: The %{office} requests that you review and complete the document described below.
      invitation_intro_sign: The %{office} requests your review and electronic signature on the agreement described below.
      organization: Organization
      signed_by: Signed by
      declined_by: Declined by
      view_only: Review only. No signature is required.
      action: Action requested
      recipient: Recipient
      reference: Reference
      date: Date
      greeting: Hello,
      dear_name: Dear %{name},
      document: Document
      requested_by: Requested by
      shared_by: Shared by
      respond_by: Respond by
      account: Account
      completed_by: Completed by
      completed_on: Completed on
      reason_given: Reason given
      review_and_sign: Review and sign
      review_and_submit: Review and complete
      view_document: View document
      view_submission: View submission
      download_copy: Download your copy
      set_up_account: Set up your account
      change_password: Choose a new password
      button_fallback: 'If the button does not work, copy this address into your browser:'
      questions_html: Questions about this request may be directed to the Office by replying to this email or writing to <a href="mailto:%{email}">%{email}</a>.
      personal_link_title: This link is personal to you.
      personal_link_body: Please do not forward this email. Anyone who has the link can open the document and act on your behalf.
      personal_link_body_account: Please do not forward this email. Anyone who has the link can use it to access your account.
      footer_privacy: Privacy
      footer_terms: Terms
      footer_esign_consent: Electronic Records and Signature Consent
      footer_notice: This message was sent by %{product_name}, the electronic agreements service of StevensED. Please do not share links contained in this message.
      # Invitation and reminder
      reminder_eyebrow: Reminder
      invitation_title_sign: 'Re: Request for electronic signature, %{name}'
      invitation_title_submit: 'Re: Request to complete %{name}'
      invitation_preheader_sign: '"%{name}" is ready for your review and signature.'
      invitation_preheader_submit: '"%{name}" is ready for you to complete.'
      reminder_intro: Our records show that this request has not yet been completed. Please attend to it at your earliest convenience.
      esign_statement_html: You may read the entire document before signing. An electronic signature has the same legal effect as a handwritten signature. By signing, you agree to the <a href="%{consent_url}">Electronic Records and Signature Consent</a>.
      # Viewer invitation
      view_title: 'Re: Document shared for your review, %{name}'
      view_preheader: '"%{name}" has been shared with you for review.'
      # Completed (to staff)
      completed_eyebrow: Completed
      completed_title: 'Re: Agreement completed, %{name}'
      completed_preheader: '"%{name}" has been completed by all parties.'
      completed_attachments: The completed document and its audit log are attached to this email.
      # Declined (to staff)
      declined_eyebrow: Declined
      declined_title: 'Re: Signature declined, %{name}'
      declined_preheader: '%{submitter} declined "%{name}".'
      declined_next_steps: Please review the submission to decide how to proceed.
      # Documents copy (to signer)
      copy_title: 'Re: Your copy of the completed agreement, %{name}'
      copy_preheader: Your copy of "%{name}" is ready.
      copy_attached: A copy of the completed document is attached to this email for your records.
      copy_retain: We recommend that you keep a copy of this document with your records.
      # One-time code
      otp_title: 'Re: Verification code'
      otp_preheader: Use this code to confirm your email address.
      otp_intro_html: 'Use the following code to verify your email address and open <strong>"%{name}"</strong>:'
      otp_do_not_share: Enter the code on the page where it was requested. Do not share this code with anyone.
      otp_not_requested_html: If you did not request this code, please reply to this email or write to <a href="mailto:%{email}">%{email}</a>.
      # User invitation
      user_invite_title: 'Re: Invitation to %{product_name}'
      user_invite_preheader: Set up your %{product_name} account.
      user_invite_not_expected: If you were not expecting this invitation, you may disregard this email. No account will be created unless you complete the setup.
      # Password reset
      reset_title: 'Re: Password reset request'
      reset_preheader: Use the link in this email to choose a new password.
      reset_intro: We received a request to reset the password for your %{product_name} account. To choose a new password, use the button below.
      reset_unchanged: Your password will not change until you open the link above and set a new one.
      reset_not_requested_html: If you did not request a password reset, you may disregard this email. If you are concerned about the security of your account, please write to <a href="mailto:%{email}">%{email}</a>.
      # SMTP test
      smtp_title: 'Re: Email delivery confirmed'
      smtp_preheader: '%{product_name} can send email with the configured settings.'
      smtp_intro: This message confirms that %{product_name} can send email using the SMTP settings that were just saved.
      smtp_no_action: No further action is required.
  client: Client
  devise:
    mailer:
      reset_password_instructions:
        subject: 'StevensED Agreements: password reset instructions'
