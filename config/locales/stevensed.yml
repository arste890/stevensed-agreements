# StevensED fork strings (English; other locales fall back to en).
en:
  stevensed:
    legal_notices: Legal notices
    logo_invalid: The logo must be a PNG, JPEG or WebP image of 2 MB or less.
    logo_hint: PNG, JPEG or WebP, 2 MB or less. Shown on signing pages and in the dashboard.
    reminder_prefix: 'Reminder:'
    reminder_subject_prefix: 'StevensED reminder:'
    sso_failed: Single sign-on did not complete. Try again or contact legal@stevensed.org.
    sign_in_with_stevensed: Sign in with StevensED
    sign_in_with_saml: Sign in with single sign-on
    or: or
