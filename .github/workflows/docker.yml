name: Build StevensED Agreements image

# StevensED fork: builds linux/arm64 for the Oracle Ampere VM and publishes to GHCR.
# Upstream's Docker Hub workflow is replaced; no repository secrets are required.
on:
  push:
    branches: [stevensed/main]
    tags: ["stevensed-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Version file
        run: echo "3.4.0-stevensed+$(git rev-parse --short HEAD)" > .version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arste890/stevensed-agreements
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/stevensed/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
